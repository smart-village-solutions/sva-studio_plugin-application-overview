publiccodeYmlVersion: '0'
name: Anwendungen
url: https://github.com/smart-village-solutions/sva-studio_plugin-application-overview
platforms: [web]
developmentStatus: development
softwareType: addon
description:
  de:
    localisedName: Anwendungen
    shortDescription: Kommunale Web-Anwendungen über einen gemeinsamen Arbeitsplatz öffnen.
    longDescription: >-
      Das optionale Plugin ergänzt die Kopfzeile um eine Kachelübersicht ohne Seitenleiste.
      Berechtigte Benutzer verwalten Ziele, Tabler-Icons, Reihenfolge und mehrsprachige Texte
      in den Plugin-Einstellungen. SVA Studio steht immer an erster Stelle.
      Anmeldung und Rechte der verlinkten Anwendungen bleiben deren Verantwortung.
    features:
      - Gemeinsamer Anwendungsarbeitsplatz
      - Mehrsprachige Kacheln und Tabler-Icon-Auswahl
      - Berechtigte instanzbezogene Konfiguration
  en:
    localisedName: Applications
    shortDescription: Open municipal web applications from a shared workspace.
    longDescription: >-
      This optional plugin adds an application launcher without a sidebar.
      Authorized users manage destinations, Tabler icons, order and translated texts.
      SVA Studio always appears first. Target applications retain their own authentication.
    features:
      - Shared application workspace
      - Multilingual tiles and Tabler icon picker
      - Authorized tenant-specific configuration
